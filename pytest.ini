[pytest]
testpaths = tests automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    api: Backend API integration tests
    e2e: End-to-end Selenium browser tests
    gateway_live: Tests requiring live Stripe or Razorpay sandbox API credentials
    negative: Negative and error-handling scenarios
log_cli = true
log_cli_level = INFO
